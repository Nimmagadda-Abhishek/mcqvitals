    <script>
      // Global PrintScreen blocking - runs before any React code
      document.addEventListener('keydown', function(e) {
        if (e.key === 'PrintScreen') {
          e.preventDefault();
          e.stopPropagation();
          e.returnValue = false;
          alert('Screenshots and screen recordings are not allowed on this platform.');
          return false;
        }
      }, true);
      
      // Block Ctrl+S
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          e.stopPropagation();
          e.returnValue = false;
          return false;
        }
      }, true);
      
      // Block Ctrl+P (Print)
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
          e.preventDefault();
          e.stopPropagation();
          e.returnValue = false;
          alert('Printing is not allowed on this platform.');
          return false;
        }
      }, true);
    </script>
